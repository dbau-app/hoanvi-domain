<script>

  var TOKEN_KEY = 'hoanvi_token';
  var token = localStorage.getItem(TOKEN_KEY) || null;
  var dash = null;
  var pendingVerifyEmail = null;

  function showSpinner(v){ document.getElementById('spinner').classList.toggle('show', v); }
  function setBtnLoading(btn, loading, loadingLabel){
    if(loading){
      btn.dataset.originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner' + (btn.classList.contains('mini-btn') ? ' dark' : '') + '"></span>' + (loadingLabel || 'Đang xử lý…');
    } else {
      btn.disabled = false;
      if(btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
    }
  }
  function fmt(n){ n = Math.round(n||0); return n.toLocaleString('vi-VN') + 'đ'; }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeImageUrl(url){
    url = String(url || '').trim();
    return /^https?:\/\//i.test(url) ? url : '';
  }
  function productBlock(name, image, cls){
    name = String(name || '').trim();
    image = safeImageUrl(image);
    if(!name && !image) return '';
    var c = cls || 'link-product';
    var img = image
      ? '<img class="product-image" src="'+escapeHtml(image)+'" alt="Sản phẩm Shopee" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';">'
      : '<div class="product-image" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-faint);">🛍️</div>';
    return '<div class="'+c+'">'+img+
      '<div class="product-info"><div class="product-label">Sản phẩm</div>'+
      '<div class="product-name">'+escapeHtml(name || 'Sản phẩm Shopee')+'</div></div></div>';
  }
  function call(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject){
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
    });
  }

  function showAuthPanel(id){
    ['login-form','register-form','verify-form','forgot-form','reset-form'].forEach(function(p){ document.getElementById(p).style.display = (p===id) ? 'block' : 'none'; });
  }

</script>
